<svg xmlns="http://www.w3.org/2000/svg" width="900" height="470" viewBox="0 0 900 470" font-family="Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1,1 L7,4 L1,7" fill="none" stroke="#e5e5e5" stroke-width="1.2"/></marker>
  </defs>

  <rect width="900" height="470" fill="#000"/>
  <text x="20" y="34" font-size="16" fill="#fafafa">How a send reaches your accounts</text>

  <g fill="none" stroke="#525252" stroke-width="1">
    <rect x="20" y="62" width="210" height="196"/>
    <rect x="280" y="62" width="330" height="388"/>
    <rect x="670" y="62" width="210" height="196"/>
  </g>

  <g font-family="'IBM Plex Mono', 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" letter-spacing="0.6" fill="#fafafa">
    <g fill="#a3a3a3">
      <text x="34" y="86">AGENT MACHINE</text>
      <text x="294" y="86">SERVER MACHINE</text>
      <text x="684" y="86">YOUR DEVICES</text>
    </g>

    <rect x="50" y="104" width="150" height="34" fill="none" stroke="#737373" stroke-dasharray="3 3"/>
    <text x="125" y="125" text-anchor="middle" fill="#a3a3a3">ANY AGENTS …</text>
    <rect x="50" y="174" width="150" height="40" fill="none" stroke="#e5e5e5"/>
    <text x="125" y="198" text-anchor="middle">AGENT IDENTITY</text>

    <rect x="330" y="170" width="230" height="48" fill="#064e3b"/>
    <text x="445" y="198" text-anchor="middle" font-size="12" fill="#ecfdf5">MANDATE</text>
    <rect x="350" y="330" width="190" height="40" fill="none" stroke="#e5e5e5"/>
    <text x="445" y="354" text-anchor="middle">CONNECTOR</text>
    <rect x="350" y="394" width="190" height="34" fill="none" stroke="#737373" stroke-dasharray="3 3"/>
    <text x="445" y="415" text-anchor="middle" fill="#a3a3a3">MORE CONNECTORS …</text>

    <rect x="700" y="170" width="150" height="48" fill="#5eead4"/>
    <text x="775" y="198" text-anchor="middle" font-size="12" fill="#042f2e">MANDATE APP</text>
    <rect x="700" y="330" width="150" height="40" fill="none" stroke="#e5e5e5"/>
    <text x="775" y="354" text-anchor="middle">YOUR ACCOUNTS</text>
  </g>

  <g fill="none" stroke="#e5e5e5" stroke-width="1" marker-end="url(#a)">
    <path d="M125,138 V172"/>
    <path d="M200,194 H328"/>
    <path d="M560,182 H698"/>
    <path d="M700,206 H562"/>
    <path d="M445,218 V328"/>
    <path d="M540,350 H698"/>
  </g>

  <!-- Numbered steps, in the order a send takes them. -->
  <g font-size="11">
    <g fill="#000" stroke="#e5e5e5" stroke-width="1">
      <circle cx="264" cy="194" r="11"/>
      <circle cx="610" cy="182" r="11"/>
      <circle cx="640" cy="206" r="11"/>
      <circle cx="445" cy="272" r="11"/>
      <circle cx="655" cy="350" r="11"/>
    </g>
    <g font-family="'IBM Plex Mono', ui-monospace, Menlo, monospace" fill="#fafafa" text-anchor="middle">
      <text x="264" y="198">1</text>
      <text x="610" y="186">2</text>
      <text x="640" y="210">3</text>
      <text x="445" y="276">4</text>
      <text x="655" y="354">5</text>
    </g>
    <g fill="#a3a3a3">
      <text x="264" y="226" text-anchor="middle">asks</text>
      <text x="610" y="160" text-anchor="middle">notifies</text>
      <text x="640" y="238" text-anchor="middle">approves</text>
      <text x="464" y="276">signed write</text>
      <text x="655" y="382" text-anchor="middle">its login</text>
    </g>
  </g>
</svg>
