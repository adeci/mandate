<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420" font-family="Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <style>
    .g0 { fill: #f8fafc; stroke: #cbd5e1 }
    .g1 { fill: #eef2ff; stroke: #a5b4fc }
    .g2 { fill: #ecfdf5; stroke: #6ee7b7 }
    .card { fill: #fff; stroke: #e2e8f0 }
    .dash { fill: none; stroke: #cbd5e1; stroke-dasharray: 5 4 }
    .t { fill: #0f172a }
    .s { fill: #64748b }
    .m { fill: #94a3b8 }
    .l0 { fill: #475569 }
    .l1 { fill: #4f46e5 }
    .l2 { fill: #047857 }
    .a0 { stroke: #475569 }
    .a1 { stroke: #4f46e5 }
    .a2 { stroke: #059669 }
    .h1 { fill: #4f46e5 }
    .h2 { fill: #059669 }
    @media (prefers-color-scheme: dark) {
      .g0 { fill: #161b22; stroke: #30363d }
      .g1 { fill: #1b1d3a; stroke: #4f46e5 }
      .g2 { fill: #0f2a22; stroke: #059669 }
      .card { fill: #0d1117; stroke: #30363d }
      .dash { stroke: #484f58 }
      .t { fill: #e6edf3 }
      .s { fill: #8b949e }
      .m { fill: #6e7681 }
      .l0 { fill: #9da7b3 }
      .l1 { fill: #a5b4fc }
      .l2 { fill: #34d399 }
      .a0 { stroke: #9da7b3 }
      .a1 { stroke: #818cf8 }
      .a2 { stroke: #34d399 }
    }
  </style>
  <defs>
    <marker id="m0" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 Z" class="l0"/></marker>
    <marker id="m1" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 Z" class="l1"/></marker>
    <marker id="m2" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 Z" class="l2"/></marker>
  </defs>

  <rect x="20" y="20" width="200" height="250" rx="14" class="g0"/>
  <text x="38" y="48" font-size="13" font-weight="600" class="l0">Agent machine</text>
  <rect x="40" y="70" width="160" height="46" rx="10" class="dash"/>
  <text x="120" y="98" text-anchor="middle" font-size="13" class="m">any agents …</text>
  <line x1="120" y1="116" x2="120" y2="146" stroke-width="1.5" class="a0" marker-end="url(#m0)"/>
  <rect x="40" y="150" width="160" height="64" rx="10" class="card"/>
  <text x="120" y="178" text-anchor="middle" font-size="15" font-weight="600" class="t">agent identity</text>
  <text x="120" y="198" text-anchor="middle" font-size="11" class="s">mandate CLI</text>

  <rect x="260" y="20" width="380" height="380" rx="14" class="g1"/>
  <text x="278" y="48" font-size="13" font-weight="600" class="l1">Server machine</text>
  <rect x="290" y="140" width="320" height="84" rx="10" class="h1"/>
  <text x="450" y="176" text-anchor="middle" font-size="16" font-weight="600" fill="#fff">mandate</text>
  <text x="450" y="200" text-anchor="middle" font-size="11" fill="#c7d2fe">grants · approvals · one HTTPS port</text>
  <rect x="290" y="280" width="200" height="60" rx="10" class="card"/>
  <text x="390" y="306" text-anchor="middle" font-size="15" font-weight="600" class="t">connector</text>
  <text x="390" y="325" text-anchor="middle" font-size="11" class="s">one account · its login</text>
  <rect x="290" y="352" width="200" height="36" rx="10" class="dash"/>
  <text x="390" y="375" text-anchor="middle" font-size="13" class="m">more connectors …</text>

  <rect x="680" y="20" width="200" height="250" rx="14" class="g2"/>
  <text x="698" y="48" font-size="13" font-weight="600" class="l2">Your devices</text>
  <rect x="700" y="140" width="160" height="84" rx="10" class="h2"/>
  <text x="780" y="176" text-anchor="middle" font-size="16" font-weight="600" fill="#fff">mandate app</text>
  <text x="780" y="200" text-anchor="middle" font-size="11" fill="#a7f3d0">phone · desktop</text>

  <rect x="680" y="280" width="200" height="60" rx="10" class="card"/>
  <text x="780" y="306" text-anchor="middle" font-size="15" font-weight="600" class="t">your accounts</text>
  <text x="780" y="325" text-anchor="middle" font-size="11" class="s">WhatsApp · Signal · email · …</text>

  <line x1="200" y1="182" x2="286" y2="182" stroke-width="1.5" class="a0" marker-end="url(#m0)"/>
  <text x="243" y="172" text-anchor="middle" font-size="11" class="l0">asks</text>

  <line x1="610" y1="168" x2="696" y2="168" stroke-width="1.5" class="a1" marker-end="url(#m1)"/>
  <text x="653" y="158" text-anchor="middle" font-size="11" class="l1">notifies</text>
  <line x1="700" y1="196" x2="614" y2="196" stroke-width="1.5" class="a2" marker-end="url(#m2)"/>
  <text x="657" y="214" text-anchor="middle" font-size="11" class="l2">approves</text>

  <line x1="390" y1="224" x2="390" y2="276" stroke-width="1.5" class="a0" marker-end="url(#m0)"/>
  <text x="400" y="254" font-size="11" class="l0">signed writes</text>

  <line x1="490" y1="310" x2="676" y2="310" stroke-width="1.5" class="a0" marker-end="url(#m0)"/>
  <text x="583" y="300" text-anchor="middle" font-size="11" class="l0">its login</text>
</svg>
