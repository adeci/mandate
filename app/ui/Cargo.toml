[package]
name = "mandate-app"
version = "0.0.0"
edition.workspace = true
publish = false

[lib]
name = "mandate_app"

[dependencies]
futures = "0.3"
gpui = { package = "gpui-pre", version = "=0.3.7", default-features = false }
libc = "0.2"
qrcode = { version = "0.14", default-features = false }
mandate-core = { path = "../core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(not(target_os = "android"))'.dependencies]
# guess_compositor() reads these features on gpui itself, not on gpui-platform.
gpui = { package = "gpui-pre", version = "=0.3.7", default-features = false, features = ["wayland", "x11"] }
gpui-platform = { package = "gpui-pre-platform", version = "=0.3.7", features = ["wayland", "x11"] }
# The rest are already in gpui's tree, but for cryptoki.
aes = "0.8"
cbc = "0.1"
cryptoki = "0.12"
getrandom = "0.4"
hmac = "0.13"
oo7 = { version = "0.6", default-features = false, features = ["async-std", "native_crypto"] }
p256 = { version = "0.14", default-features = false, features = ["ecdsa", "std"] }
sha2 = "0.11"
zbus = { version = "5", default-features = false, features = ["async-io", "blocking-api"] }

[target.'cfg(target_os = "android")'.dependencies]
android-activity = { version = "0.6", features = ["native-activity"] }
android_logger = "0.15"
gpui-mobile = { package = "gpui-pre-mobile", git = "https://github.com/longbridge/gpui-mobile", rev = "9075e3aa3eea812127f2c60ed66f0cd5798ff245", default-features = false }
jni = "0.22"
log = "0.4"
rqrr = "0.11"
