[package]
name = "mandate-core"
version = "0.1.0"
edition.workspace = true
publish = false

[dependencies]
aes-gcm = { version = "0.11", default-features = false, features = ["aes", "alloc"] }
base64 = "0.23"
curve25519-dalek = "5"
getrandom = "0.4"
hmac = "0.13"
p256 = { version = "0.14", default-features = false, features = ["ecdsa", "std"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rustls-webpki = { version = "0.103", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
webpki-roots = "1"
